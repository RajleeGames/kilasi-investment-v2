{% if page_obj.has_other_pages %}
<nav class="ki-pagination" aria-label="Pagination">
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div class="ki-page-links">
    {% if page_obj.has_previous %}
      <a class="btn btn-secondary btn-sm" href="?{{ page_query }}page=1">First</a>
      <a class="btn btn-secondary btn-sm" href="?{{ page_query }}page={{ page_obj.previous_page_number }}">Previous</a>
    {% endif %}
    {% if page_obj.has_next %}
      <a class="btn btn-secondary btn-sm" href="?{{ page_query }}page={{ page_obj.next_page_number }}">Next</a>
      <a class="btn btn-secondary btn-sm" href="?{{ page_query }}page={{ page_obj.paginator.num_pages }}">Last</a>
    {% endif %}
  </div>
</nav>
{% endif %}
